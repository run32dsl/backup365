# backup365 : console seule (`docker compose up -d`) ou console + MinIO local
# (`docker compose --profile minio up -d`). Voir docs/installation.md.
#
# Configuration : copier .env.example en .env ; secrets : un fichier par secret dans ./secrets/.
# La console n'a pas d'authentification : le port n'est publié que sur 127.0.0.1.

name: backup365

services:
  console:
    build:
      context: .
      dockerfile: Containerfile
    image: backup365:local
    restart: unless-stopped
    ports:
      - '127.0.0.1:${BACKUP365_PORT:-3000}:3000'
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BACKUP365_TENANT_ID: ${BACKUP365_TENANT_ID:-}
      BACKUP365_S3_ENDPOINT: ${BACKUP365_S3_ENDPOINT:-}
      BACKUP365_S3_REGION: ${BACKUP365_S3_REGION:-}
      BACKUP365_STATUS_MAX_AGE_HOURS: ${BACKUP365_STATUS_MAX_AGE_HOURS:-}
      BACKUP365_STATUS_WORKLOADS: ${BACKUP365_STATUS_WORKLOADS:-}
      BACKUP365_CATALOG_CACHE_MINUTES: ${BACKUP365_CATALOG_CACHE_MINUTES:-}
      BACKUP365_INDEX_INTERVAL_MINUTES: ${BACKUP365_INDEX_INTERVAL_MINUTES:-}
      # Ancres du journal d'audit, sur un volume distinct des données (docs/installation.md).
      BACKUP365_AUDIT_ANCHOR_DIR: /anchors
      BACKUP365_AUDIT_ANCHOR_INTERVAL_MIN: ${BACKUP365_AUDIT_ANCHOR_INTERVAL_MIN:-}
      # Secrets lus dans des fichiers montés, jamais dans l'environnement.
      BACKUP365_S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      BACKUP365_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      BACKUP365_ENCRYPTION_PASSPHRASE_FILE: /run/secrets/encryption_passphrase
    secrets:
      - s3_access_key_id
      - s3_secret_access_key
      - encryption_passphrase
    volumes:
      - console-data:/data
      # Par défaut un volume nommé ; pour une vraie protection, le remplacer par un montage vers
      # un autre stockage (ex. `${BACKUP365_ANCHOR_PATH}:/anchors`, partage à instantanés immuables).
      - console-anchors:/anchors
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Stockage S3 local, facultatif (essais, petite installation). En production, préférer le
  # stockage S3 immuable de l'organisation (docs/mise-en-production.md).
  minio:
    profiles: [minio]
    # MinIO de Chainguard, épinglé par digest (index multi-architecture, publié le 2026-09-24),
    # le même que les tests de bout en bout d'Atlas. Mise à jour : relire la version, puis
    # `skopeo inspect --raw docker://cgr.dev/chainguard/minio:latest | sha256sum`.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key_id
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_access_key
    secrets:
      - s3_access_key_id
      - s3_secret_access_key
    volumes:
      - minio-data:/data
    # Aucun port publié : seule la console joint MinIO (http://minio:9000).

secrets:
  s3_access_key_id:
    file: ./secrets/s3_access_key_id
  s3_secret_access_key:
    file: ./secrets/s3_secret_access_key
  encryption_passphrase:
    file: ./secrets/encryption_passphrase

volumes:
  console-data:
  console-anchors:
  minio-data:
