packages:
  - apps/*
  - packages/*

# Dépendance transitive du SDK Atlas : son script d'installation n'affiche qu'une bannière.
allowBuilds:
  core-js-pure: false

# SDK Atlas 7.3.0, autorisé par le PM (issue #609, ADR 0019) : publié trop récemment pour la
# règle d'âge minimal de pnpm. Exception limitée à cette version exacte.
minimumReleaseAgeExclude:
  - '@wisecom/atlas-sdk@7.3.0'
