name: Publish image

# Publie l'image sur ghcr.io à chaque fusion sur develop et à chaque tag de version.
# Seul GITHUB_TOKEN est utilisé ; aucune action tierce : docker est fourni par le runner.
on:
  push:
    branches: [develop]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/run32dsl/backup365

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Le nom du tag n'est jamais interpolé dans le script : il passe par l'environnement.
      - name: Build the image (linux/amd64)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags=("${GITHUB_REF_NAME#v}")
          else
            tags=(develop "sha-${GITHUB_SHA::7}")
          fi
          args=()
          for t in "${tags[@]}"; do args+=(-t "$IMAGE:$t"); done
          printf '%s\n' "${tags[@]}" > "$RUNNER_TEMP/tags"
          docker build --platform linux/amd64 -f Containerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            "${args[@]}" .
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push
        run: while read -r t; do docker push "$IMAGE:$t"; done < "$RUNNER_TEMP/tags"
