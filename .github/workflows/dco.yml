name: DCO

# `pull_request` et jamais `pull_request_target` : le code de la PR ne s'exécute qu'avec un jeton
# en lecture seule et sans secret. Aucune action tierce, seulement un script shell du dépôt.
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the script refuses an unsigned commit
        run: bash .github/scripts/check-dco.test.sh
      # Seules les PR venant d'un fork sont contrôlées : les autres sont écrites par les agents et
      # le mainteneur. Le script vient de la base, pas de la PR, pour qu'elle ne puisse pas
      # l'affaiblir ; une modification de .github/ reste à relire (CODEOWNERS). Pas de tube vers
      # bash : sans pipefail, un script absent de la base ferait passer l'étape à vide. La commande
      # tient sur une ligne, check-dco.test.sh l'extrait et la rejoue.
      - name: Check every commit of a fork PR has a Signed-off-by line
        if: github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git show "$BASE_SHA:.github/scripts/check-dco.sh" > "$RUNNER_TEMP/check-dco.sh" && bash "$RUNNER_TEMP/check-dco.sh" "$BASE_SHA" "$HEAD_SHA"
