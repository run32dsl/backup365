name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # La version de pnpm vient du champ packageManager de package.json.
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -f Containerfile -t backup365:ci .
      - name: Check the image starts and serves the console
        run: |
          # Mêmes restrictions que compose.yaml.
          docker run -d --name b365 -p 127.0.0.1:3000:3000 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges -v b365data:/data backup365:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health || { docker logs b365; exit 1; }
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root">'
          test "$(docker exec b365 id -u)" != 0
          docker exec b365 ls /data/audit.sqlite
      - name: Check compose.yaml is valid
        run: |
          mkdir secrets
          for s in s3_access_key_id s3_secret_access_key encryption_passphrase; do echo x > "secrets/$s"; done
          docker compose --profile minio config --quiet
